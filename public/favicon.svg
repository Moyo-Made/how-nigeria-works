<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Three Arms</title>
  <!-- The confluence from the national coat of arms: the Niger and the Benue
       meeting at Lokoja. Two channels arrive, one river leaves — which is why
       the trunk is drawn heavier than the arms. Flag green ground so the mark
       holds its own in a light or a dark tab strip. -->
  <rect width="32" height="32" rx="7.5" fill="#008751" />
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.9 7.9 16 17.6 25.1 7.9" stroke-width="3.2" />
    <path d="M16 17.6V25.1" stroke-width="4.8" />
  </g>
</svg>
