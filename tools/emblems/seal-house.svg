<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!--
    The seal of the House of Representatives as it hangs behind the Speaker's
    chair, drawn for this project from the contractor's photographs of the
    renovated chamber (Figueras gallery images g05, g07, g09): a white disc with
    a thin dark green rim, HOUSE OF REPRESENTATIVES arched over the top and
    FEDERAL REPUBLIC OF NIGERIA under the bottom, a star at either side between
    them, an inner ring and a ring of small stars inside it, and the coat of
    arms at the centre.

    Pitched at the size it is seen: a disc a metre and a bit across on a wall
    read from the floor of the House, so the lettering is heavy and the stars
    are plain.
  -->
  <defs>
    <path id="top" d="M 128.2 487.0 A 372 372 0 0 1 871.8 487.0" />
    <path id="bottom" d="M 79.0 653.2 A 448 448 0 0 0 921.0 653.2" />
    <polygon id="star" points="0,-1 0.2245,-0.309 0.9511,-0.309 0.3633,0.118 0.5878,0.809 0,0.382 -0.5878,0.809 -0.3633,0.118 -0.9511,-0.309 -0.2245,-0.309" />
    <filter id="keyline" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="grown" />
      <feFlood flood-color="#8e8e88" />
      <feComposite in2="grown" operator="in" result="line" />
      <feMerge><feMergeNode in="line" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <circle cx="500" cy="500" r="492" fill="#f6f6f2" stroke="#1f5a3a" stroke-width="10" />
  <circle cx="500" cy="500" r="342" fill="none" stroke="#1f5a3a" stroke-width="6" />

  <g fill="#1f5a3a" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700">
    <text font-size="70"><textPath href="#top" textLength="1143" lengthAdjust="spacing">HOUSE OF REPRESENTATIVES</textPath></text>
    <text font-size="62"><textPath href="#bottom" textLength="1095" lengthAdjust="spacing">FEDERAL REPUBLIC OF NIGERIA</textPath></text>
  </g>

  <g fill="#1f5a3a">
    <use href="#star" transform="translate(99.0 585.2) scale(22)" />
    <use href="#star" transform="translate(901.0 585.2) scale(22)" />
  </g>

  <!-- the ring of small stars inside the inner rim -->
  <g fill="#1f5a3a">
    <use href="#star" transform="translate(500.0 188.0) scale(10)" />
    <use href="#star" transform="translate(548.8 191.8) scale(10)" />
    <use href="#star" transform="translate(596.4 203.3) scale(10)" />
    <use href="#star" transform="translate(641.6 222.0) scale(10)" />
    <use href="#star" transform="translate(683.4 247.6) scale(10)" />
    <use href="#star" transform="translate(720.6 279.4) scale(10)" />
    <use href="#star" transform="translate(752.4 316.6) scale(10)" />
    <use href="#star" transform="translate(778.0 358.4) scale(10)" />
    <use href="#star" transform="translate(796.7 403.6) scale(10)" />
    <use href="#star" transform="translate(808.2 451.2) scale(10)" />
    <use href="#star" transform="translate(812.0 500.0) scale(10)" />
    <use href="#star" transform="translate(808.2 548.8) scale(10)" />
    <use href="#star" transform="translate(796.7 596.4) scale(10)" />
    <use href="#star" transform="translate(778.0 641.6) scale(10)" />
    <use href="#star" transform="translate(752.4 683.4) scale(10)" />
    <use href="#star" transform="translate(720.6 720.6) scale(10)" />
    <use href="#star" transform="translate(683.4 752.4) scale(10)" />
    <use href="#star" transform="translate(641.6 778.0) scale(10)" />
    <use href="#star" transform="translate(596.4 796.7) scale(10)" />
    <use href="#star" transform="translate(548.8 808.2) scale(10)" />
    <use href="#star" transform="translate(500.0 812.0) scale(10)" />
    <use href="#star" transform="translate(451.2 808.2) scale(10)" />
    <use href="#star" transform="translate(403.6 796.7) scale(10)" />
    <use href="#star" transform="translate(358.4 778.0) scale(10)" />
    <use href="#star" transform="translate(316.6 752.4) scale(10)" />
    <use href="#star" transform="translate(279.4 720.6) scale(10)" />
    <use href="#star" transform="translate(247.6 683.4) scale(10)" />
    <use href="#star" transform="translate(222.0 641.6) scale(10)" />
    <use href="#star" transform="translate(203.3 596.4) scale(10)" />
    <use href="#star" transform="translate(191.8 548.8) scale(10)" />
    <use href="#star" transform="translate(188.0 500.0) scale(10)" />
    <use href="#star" transform="translate(191.8 451.2) scale(10)" />
    <use href="#star" transform="translate(203.3 403.6) scale(10)" />
    <use href="#star" transform="translate(222.0 358.4) scale(10)" />
    <use href="#star" transform="translate(247.6 316.6) scale(10)" />
    <use href="#star" transform="translate(279.4 279.4) scale(10)" />
    <use href="#star" transform="translate(316.6 247.6) scale(10)" />
    <use href="#star" transform="translate(358.4 222.0) scale(10)" />
    <use href="#star" transform="translate(403.6 203.3) scale(10)" />
    <use href="#star" transform="translate(451.2 191.8) scale(10)" />
  </g>

  <g filter="url(#keyline)"><include href="coat-of-arms.svg" x="275" y="290" width="450" height="436" /></g>
</svg>
